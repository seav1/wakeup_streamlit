name: Streamlit Ultra Waker (Fixed)

on:
  schedule:
    # 每 20 分钟检查一次
    - cron: '*/20 * * * *'
  workflow_dispatch: # 支持手动点击 Run workflow 测试

jobs:
  wake-up-process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium
          playwright install-deps

      - name: Execute Wake Logic
        run: |
          python - <<EOF
          from playwright.sync_api import sync_playwright
          import time

          # 配置你的 App 列表
          apps = [
              "https://seav01.streamlit.app/",
              "https://seav02.streamlit.app/",
              "https://aseava.streamlit.app/"
          ]

          def process_app(browser_context, url):
              page = browser_context.new_page()
              print(f"\n--- 正在处理: {url} ---")
              try:
                  # 1. 访问页面
                  # 使用 commit 状态确保基础 DOM 加载完成
                  page.goto(url, wait_until="commit", timeout=60000)
                  time.sleep(8) # 给 Streamlit 框架一点初始化的时间

                  # 2. 状态检测逻辑
                  # 检查是否存在 "Wake up" 按钮
                  wake_button = page.get_by_text("Wake up", exact=False)
                  
                  if wake_button.is_visible():
                      print(f"状态：[睡眠中] 检测到唤醒按钮，正在点击...")
                      wake_button.click()
                      
                      # 3. 维持会话，等待启动
                      print("已点击，维持连接中（最长 60 秒）...")
                      start_time = time.time()
                      while time.time() - start_time < 60:
                          time.sleep(10)
                          # 如果按钮不见了，或者出现了 Streamlit 的主 App 容器
                          if not wake_button.is_visible() or page.locator(".stApp").is_visible():
                              print("检测到容器已拉起或按钮消失，正在进行最终握手...")
                              time.sleep(10) # 确保 WebSocket 稳定
                              break
                          print("容器仍在冷启动，保持连接...")
                      print(f"结果：{url} 唤醒流程执行完毕。")
                  
                  elif page.locator(".stApp").is_visible():
                      print("状态：[运行中] App 已经是活跃状态。")
                  
                  else:
                      print("状态：[未知] 未发现按钮也未发现 App 容器，可能是网络波动或正在重定向。")
                      # 额外停留一下，防止是因为加载慢导致的误判
                      time.sleep(10)

              except Exception as e:
                  print(f"异常：访问 {url} 失败: {str(e)}")
              finally:
                  page.close()

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              # 伪装成真实的桌面 Chrome 浏览器
              context = browser.new_context(
                  user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
                  viewport={'width': 1280, 'height': 720}
              )
              
              for app_url in apps:
                  process_app(context, app_url)
              
              browser.close()
          EOF
