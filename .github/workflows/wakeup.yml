name: Streamlit Keep-Alive

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

jobs:
  wake-apps:
    runs-on: ubuntu-latest
    steps:
      - name: Setup
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Run Waker
        run: |
          python - <<EOF
          from playwright.sync_api import sync_playwright
          import time

          APPS = [
              "https://seav01.streamlit.app/",
              "https://seav02.streamlit.app/",
              "https://aseava.streamlit.app/"
          ]
          
          # 选择器配置
          WAKE_BTN = 'button[data-testid="wakeup-button-viewer"]'
          TOOLBAR = '[data-testid="stToolbarActions"]'

          def wake(context, url):
              page = context.new_page()
              print(f">>> {url}")
              try:
                  # 访问并等待基础结构加载
                  page.goto(url, wait_until="commit", timeout=60000)
                  
                  # 智能等待：监听“唤醒按钮”或“运行中工具栏”
                  try:
                      page.wait_for_selector(f"{WAKE_BTN}, {TOOLBAR}", timeout=30000)
                  except:
                      pass 

                  if page.locator(WAKE_BTN).is_visible():
                      print("  [!] 检测到睡眠页，正在点击唤醒...")
                      page.locator(WAKE_BTN).click(force=True)
                      # 维持连接 30 秒，确保后端容器有足够时间拉起并看到我们的连接
                      time.sleep(30)
                      print("  [√] 唤醒信号已发送并维持。")
                      
                  elif page.locator(TOOLBAR).is_visible():
                      print("  [+] App 状态活跃：已检测到运行工具栏。")
                      
                  else:
                      # 兜底：如果都没有，可能还没加载完，多等 10 秒看一眼
                      time.sleep(10)
                      if page.locator(TOOLBAR).is_visible():
                          print("  [+] App 状态活跃（延迟加载确认）。")
                      else:
                          print("  [-] 无法确认状态，请检查网络或 URL 是否有效。")
                          
              except Exception as e:
                  print(f"  [x] 运行时异常: {e}")
              finally:
                  page.close()

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              context = browser.new_context(
                  user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"
              )
              for url in APPS:
                  wake(context, url)
              browser.close()
          EOF
