- name: Run Wake Script
        run: |
          python - <<EOF
          from playwright.sync_api import sync_playwright
          import time

          apps = [
              "https://seav01.streamlit.app/",
              "https://seav02.streamlit.app/"
          ]

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              # 增加请求头，更像真实用户
              context = browser.new_context(
                  user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
                  viewport={'width': 1280, 'height': 720}
              )
              
              for url in apps:
                  page = context.new_page()
                  print(f"[{time.strftime('%H:%M:%S')}] 访问: {url}")
                  try:
                      # 1. 进入页面
                      page.goto(url, wait_until="domcontentloaded", timeout=60000)
                      
                      # 2. 寻找唤醒按钮
                      # 有时按钮在 iframe 里或者需要一点时间显示
                      time.sleep(5) 
                      wake_button = page.get_by_text("Wake", exact=False)
                      
                      if wake_button.is_visible():
                          print(f"  [!] 检测到睡眠状态，正在执行点击...")
                          wake_button.click()
                          
                          # 3. 关键改进：等待“加载中”的状态消失
                          # 模拟点击后，Streamlit 会显示 "Starting..." 或加载动画
                          print("  [~] 已点击，正在维持连接以等待容器启动...")
                          
                          # 循环检查 30 秒，或者直到按钮消失（说明进入了加载流程）
                          for _ in range(6):
                              time.sleep(5)
                              if not page.get_by_text("Wake", exact=False).is_visible():
                                  print("  [+] 按钮已消失，App 正在拉起...")
                                  break
                          
                          # 4. 额外等待，确保 WebSocket 握手完成
                          # 这是最重要的一步，防止过早断开导致唤醒中止
                          time.sleep(15) 
                          print(f"  [√] 唤醒流程执行完毕: {url}")
                      else:
                          # 检查是否已经显示了正常 App 的元素（比如 Streamlit 的菜单）
                          if page.locator(".stApp").is_visible():
                              print(f"  [+] App 已经是活跃状态。")
                          else:
                              print(f"  [?] 未发现按钮也未发现 App 内容，可能正在加载中。")
                          
                  except Exception as e:
                      print(f"  [x] 发生错误: {e}")
                  finally:
                      page.close()
              
              browser.close()
          EOF
