name: Streamlit Ultra Waker (Fixed)

on:
  schedule:
    # 每 20 分钟检查一次
    - cron: '*/20 * * * *'
  workflow_dispatch: # 支持手动点击 Run workflow 测试

jobs:
  wake-up-process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium
          playwright install-deps

      - name: Execute Wake Logic
        run: |
          python - <<EOF
          from playwright.sync_api import sync_playwright
          import time

          apps = [
              "https://seav01.streamlit.app/",
              "https://seav02.streamlit.app/",
              "https://aseava.streamlit.app/"
          ]

          def process_app(context, url):
              page = context.new_page()
              print(f"\n>>> 访问目标: {url}")
              try:
                  # 1. 尝试多次加载，直到能看到内容或超时
                  page.goto(url, wait_until="networkidle", timeout=90000)
                  
                  # 给 JS 渲染足够的等待时间（冷启动页面加载慢）
                  time.sleep(20)

                  # 2. 检查是否有特定的 Wake Up 文字
                  # 使用更底层的 JS 查找方式，穿透可能的 Shadow DOM
                  is_asleep = page.evaluate("() => document.body.innerText.includes('Wake up')")
                  
                  if is_asleep:
                      print("状态：[确认睡眠] 正在执行强力 JS 点击注入...")
                      # 注入 JS 直接触发所有按钮的 click 事件
                      page.evaluate("""() => {
                          const btns = Array.from(document.querySelectorAll('button'));
                          const wakeBtn = btns.find(b => b.innerText.includes('Wake up'));
                          if (wakeBtn) {
                              wakeBtn.click();
                              return "Clicked";
                          }
                          return "Not Found";
                      }""")
                      
                      # 3. 关键：点击后模拟人类滚动和等待，防止连接过早关闭
                      print("已发送点击指令，模拟用户交互以维持拉起状态...")
                      for i in range(6):
                          page.mouse.wheel(0, 100) # 模拟滚动
                          time.sleep(10)
                          # 检查 stApp 是否出现（意味着醒了）
                          if page.locator(".stApp").is_visible():
                              print(f"检测到 .stApp 容器出现！App 已唤醒成功。")
                              break
                          print(f"等待容器拉起中... ({i+1}/6)")
                  
                  elif page.locator(".stApp").is_visible():
                      print("状态：[运行中] 应用已在线。")
                  else:
                      print("状态：[未知] 既没看到按钮也没看到 App，尝试最后强制等待...")
                      time.sleep(15)

              except Exception as e:
                  print(f"异常：{url} 处理失败: {str(e)}")
              finally:
                  page.close()

          with sync_playwright() as p:
              # 使用带 Stealth 特性的启动参数
              browser = p.chromium.launch(headless=True, args=['--disable-blink-features=AutomationControlled'])
              context = browser.new_context(
                  user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36",
                  viewport={'width': 1920, 'height': 1080}
              )
              for app_url in apps:
                  process_app(context, app_url)
              browser.close()
          EOF
