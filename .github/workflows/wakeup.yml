name: Streamlit Keep-Alive

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

jobs:
  wake-apps:
    runs-on: ubuntu-latest
    steps:
      - name: Setup
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Run Waker
        run: |
          python - <<EOF
          from playwright.sync_api import sync_playwright
          import time

          # 配置区
          APPS = [
              "https://seav01.streamlit.app/",
              "https://seav02.streamlit.app/",
              "https://aseava.streamlit.app/"
          ]
          BTN_SELECTOR = 'button[data-testid="wakeup-button-viewer"]'
          APP_SELECTOR = '.stApp'

          def wake(context, url):
              page = context.new_page()
              print(f">>> {url}")
              try:
                  page.goto(url, wait_until="commit", timeout=60000)
                  
                  # 等待按钮或 App 容器出现（哪个先出现就处理哪个）
                  try:
                      page.wait_for_selector(f"{BTN_SELECTOR}, {APP_SELECTOR}", timeout=20000)
                  except:
                      pass 

                  if page.locator(BTN_SELECTOR).is_visible():
                      page.locator(BTN_SELECTOR).click(force=True)
                      print("  [!] 检测到睡眠，已点击唤醒。")
                      # 关键：维持会话 30 秒确保冷启动完成
                      time.sleep(30)
                  else:
                      print("  [-] 已在线。")
              except Exception as e:
                  print(f"  [x] 失败: {e}")
              finally:
                  page.close()

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              context = browser.new_context(
                  user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"
              )
              for url in APPS:
                  wake(context, url)
              browser.close()
          EOF
